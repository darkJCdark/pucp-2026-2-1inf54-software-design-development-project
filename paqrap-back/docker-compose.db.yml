services:
  mysql:
    image: mysql:8.4
    container_name: paqrap-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${PAQRAP_DB_NAME:-paqrap}
      MYSQL_USER: ${PAQRAP_DB_USER:-paqrap}
      MYSQL_PASSWORD: ${PAQRAP_DB_PASSWORD:-paqrap_dev}
      MYSQL_ROOT_PASSWORD: ${PAQRAP_DB_ROOT_PASSWORD:-paqrap_root_dev}

    ports:
      - "${PAQRAP_DB_PORT:-3307}:3306"

    volumes:
      - paqrap_mysql_data:/var/lib/mysql
      - ./database/paqrap_schema_v2.sql:/docker-entrypoint-initdb.d/01_schema_v2.sql:ro
      - ./database/paqrap_seed_v2.sql:/docker-entrypoint-initdb.d/02_seed_v2.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  paqrap_mysql_data: