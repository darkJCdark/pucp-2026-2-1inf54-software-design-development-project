spring:
  application:
    name: paqrap-back

  datasource:
    url: ${PAQRAP_DB_URL:jdbc:mysql://localhost:3306/paqrap?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&rewriteBatchedStatements=true}
    username: ${PAQRAP_DB_USER:root}
    password: ${PAQRAP_DB_PASSWORD:}

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 500

        order_inserts: true

  data:
    web:
      pageable:
        max-page-size: 500

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  jackson:
    time-zone: UTC

    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PAQRAP_PORT:8080}

paqrap:
  escenarios:
    tick: ${PAQRAP_ESCENARIOS_TICK:1s}
    factor-cinco-dias: ${PAQRAP_FACTOR_CINCO_DIAS:160}
    factor-colapso: ${PAQRAP_FACTOR_COLAPSO:1440}
    intervalo-planificacion: ${PAQRAP_INTERVALO_PLANIFICACION:1h}
    intervalo-revision-rolling: ${PAQRAP_ROLLING_INTERVALO_REVISION:15m}
    ventana-riesgo-rolling: ${PAQRAP_ROLLING_VENTANA_RIESGO:60m}
    horizonte-decision: ${PAQRAP_ROLLING_HORIZONTE:36h}
    replanificar-fin-ruta: ${PAQRAP_ROLLING_REPLANIFICAR_FIN_RUTA:true}

  planificacion:
    algoritmo: ${PAQRAP_PLAN_ALGORITMO:SA}
    objetivo: ${PAQRAP_PLAN_OBJETIVO:SERVICE_THEN_COST}

    max-pedidos: ${PAQRAP_PLAN_MAX_PEDIDOS:100}
    presupuesto-ms: ${PAQRAP_PLAN_PRESUPUESTO_MS:1500}
    max-tramo-km: ${PAQRAP_PLAN_MAX_TRAMO_KM:0}

    rescate-preventivo:
      enabled: ${PAQRAP_RESCATE_PREVENTIVO:true}
      transbordos-enabled: ${PAQRAP_TRANSBORDOS:true}
      ventana-riesgo: ${PAQRAP_RESCATE_VENTANA_RIESGO:60m}
      mejora-minima-eta: ${PAQRAP_RESCATE_MEJORA_MINIMA:15m}
      espera-maxima-encuentro: ${PAQRAP_TRANSBORDO_ESPERA_MAXIMA:15m}
      cooldown-reasignacion: ${PAQRAP_RESCATE_COOLDOWN:30m}
      max-reasignaciones-por-pedido: ${PAQRAP_RESCATE_MAX_REASIGNACIONES:2}
      max-rescates-por-ciclo: ${PAQRAP_RESCATE_MAX_POR_CICLO:1}
      fraccion-presupuesto: ${PAQRAP_RESCATE_FRACCION_PRESUPUESTO:0.10}
      presupuesto-minimo: ${PAQRAP_RESCATE_PRESUPUESTO_MIN:25ms}
      presupuesto-maximo: ${PAQRAP_RESCATE_PRESUPUESTO_MAX:150ms}

    alns:
      max-pedidos: ${PAQRAP_ALNS_MAX_PEDIDOS:20000}
      initial-batch-size: ${PAQRAP_ALNS_INITIAL_BATCH_SIZE:32}
      candidate-vehicles: ${PAQRAP_ALNS_CANDIDATE_VEHICLES:6}

      min-routes-to-remove: ${PAQRAP_ALNS_MIN_ROUTES_TO_REMOVE:1}
      max-routes-to-remove: ${PAQRAP_ALNS_MAX_ROUTES_TO_REMOVE:6}

      max-iterations: ${PAQRAP_ALNS_MAX_ITERATIONS:800}
      max-iterations-without-improvement: ${PAQRAP_ALNS_MAX_NO_IMPROVEMENT:200}

      initial-temperature: ${PAQRAP_ALNS_INITIAL_TEMPERATURE:50.0}
      minimum-temperature: ${PAQRAP_ALNS_MINIMUM_TEMPERATURE:0.5}
      cooling-factor: ${PAQRAP_ALNS_COOLING_FACTOR:0.995}
      reaction-factor: ${PAQRAP_ALNS_REACTION_FACTOR:0.20}