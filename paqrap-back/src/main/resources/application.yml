spring:
  application:
    name: paqrap-back

  datasource:
    url: ${PAQRAP_DB_URL:jdbc:mysql://localhost:3306/paqrap?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&rewriteBatchedStatements=true}
    username: ${PAQRAP_DB_USER:root}
    password: ${PAQRAP_DB_PASSWORD:}

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 500

        order_inserts: true

  data:
    web:
      pageable:
        max-page-size: 500

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  jackson:
    time-zone: UTC

    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PAQRAP_PORT:8080}

paqrap:

  escenarios:

    # Cada cuánto tiempo REAL despierta el motor
    # para revisar el escenario.
    tick: ${PAQRAP_ESCENARIOS_TICK:1s}

    # FIVE_DAY:
    # 120 horas simuladas / 160
    # = 0.75 horas reales
    # = aproximadamente 45 minutos.
    factor-cinco-dias: ${PAQRAP_FACTOR_CINCO_DIAS:160}

    # COLLAPSE:
    # 24 horas simuladas por minuto real.
    factor-colapso: ${PAQRAP_FACTOR_COLAPSO:1440}

    # Intervalo SIMULADO entre planificaciones.
    #
    # DAY_TO_DAY:
    #   cada 1 hora real.
    #
    # FIVE_DAY:
    #   cada 22.5 segundos reales aprox.
    #
    # COLLAPSE:
    #   cada 2.5 segundos reales aprox.
    intervalo-planificacion: ${PAQRAP_INTERVALO_PLANIFICACION:1h}

  planificacion:

    # Motor activo.
    #
    # Valores:
    # SA
    # ALNS
    #
    # Se mantiene SA por defecto para no cambiar
    # automáticamente los tests y escenarios antiguos.
    algoritmo: ${PAQRAP_PLAN_ALGORITMO:SA}

    # Límite histórico para SA.
    max-pedidos: ${PAQRAP_PLAN_MAX_PEDIDOS:100}

    # Presupuesto máximo de cómputo por ciclo.
    presupuesto-ms: ${PAQRAP_PLAN_PRESUPUESTO_MS:1500}

    # 0 = sin límite.
    max-tramo-km: ${PAQRAP_PLAN_MAX_TRAMO_KM:0}

    alns:

      # ALNS no queda artificialmente limitado
      # a 100 pedidos.
      max-pedidos: ${PAQRAP_ALNS_MAX_PEDIDOS:20000}

      # Construcción inicial por lotes.
      initial-batch-size: ${PAQRAP_ALNS_INITIAL_BATCH_SIZE:32}

      # Vehículos que se evalúan en profundidad
      # para cada inserción.
      candidate-vehicles: ${PAQRAP_ALNS_CANDIDATE_VEHICLES:6}

      # Intensidad del destroy.
      min-routes-to-remove: ${PAQRAP_ALNS_MIN_ROUTES_TO_REMOVE:1}
      max-routes-to-remove: ${PAQRAP_ALNS_MAX_ROUTES_TO_REMOVE:6}

      # Límites de búsqueda.
      max-iterations: ${PAQRAP_ALNS_MAX_ITERATIONS:800}

      max-iterations-without-improvement: ${PAQRAP_ALNS_MAX_NO_IMPROVEMENT:200}

      # Criterio de aceptación tipo SA.
      initial-temperature: ${PAQRAP_ALNS_INITIAL_TEMPERATURE:50.0}

      minimum-temperature: ${PAQRAP_ALNS_MINIMUM_TEMPERATURE:0.5}

      cooling-factor: ${PAQRAP_ALNS_COOLING_FACTOR:0.995}

      # Adaptación de pesos destroy/repair.
      reaction-factor: ${PAQRAP_ALNS_REACTION_FACTOR:0.20}