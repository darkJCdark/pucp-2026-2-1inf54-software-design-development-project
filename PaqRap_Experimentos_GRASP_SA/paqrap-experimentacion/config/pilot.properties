name=pilot
instances.file=config/pilot.csv
seeds=42,73,101
budgets.ms=3000
# Common PaqRap experimental baseline. Values reflect the latest GRASP ZIP README.
# Strict feasibility and coverage, no numerical penalties.
fleet.cars=10
fleet.motorcycles=15
fleet.bicycles=12
speed.car=40
speed.motorcycle=25
speed.bicycle=12
central.x=27
central.y=14
east.x=57
east.y=27
stock.northwest=1000
stock.east=1000
# TIME gives both the same MAXIMUM wall-time allowance, including SA initialization.
# Native iterations are not equal work; use high caps and record actual termination.
mode=TIME
grasp.alpha=0.3
grasp.iterations=1000000
sa.temperature=1000
sa.minimumTemperature=1
sa.cooling=0.95
sa.iterationsPerTemperature=50
sa.maximumIterations=1000000
sa.maximumWithoutImprovement=1000000
worker.heap.mb=512
worker.processors=2
worker.timeout.seconds=90
warmup.rounds=1
