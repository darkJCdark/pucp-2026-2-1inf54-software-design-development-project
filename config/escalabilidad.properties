name=escalabilidad
instances.file=config/escalabilidad.csv
seeds=42,73,101
# Dos presupuestos para ver el efecto del tiempo con mas pedidos; se analizan por separado.
budgets.ms=5000,20000
# Estudio de VOLUMEN: 24 a 144 pedidos sinteticos y ventanas reales de 1, 2, 4 y 8 horas
# (21-24 de setiembre: no se usan en piloto 9-12 ni en la campana formal 13-20).
# En ventanas reales largas se excluyen pedidos ya vencidos al planificar y la auditoria
# senala los demostrablemente no atendibles (ver docs/PROTOCOLO.md).
# Resto de parametros: los mismos del perfil formal, sin calibrar.
fleet.cars=10
fleet.motorcycles=15
fleet.bicycles=12
speed.car=40
speed.motorcycle=25
speed.bicycle=12
central.x=27
central.y=14
east.x=57
east.y=27
stock.northwest=1000
stock.east=1000
mode=TIME
grasp.alpha=0.3
grasp.iterations=1000000
sa.temperature=1000
sa.minimumTemperature=1
sa.cooling=0.95
sa.iterationsPerTemperature=50
sa.maximumIterations=1000000
sa.maximumWithoutImprovement=1000000
worker.heap.mb=512
worker.processors=2
worker.timeout.seconds=90
warmup.rounds=1

# v3: latest case, no maintenance or automatic breakdowns.
maintenance.enabled=false
breakdowns.enabled=false
northwest.x=12
northwest.y=38
# Keep all collected demand (including overdue backlog); never hide failure by default.
orders.expiredPolicy=KEEP
# No 80-km-per-leg limit in the supplied master case. Set 80 only for a declared sensitivity check.
routing.maxLegKm=0
# Fixed one-hour meal slots at 10-11, 18-19, 02-03; a declared scheduling policy, not a teacher mandate.
meal.startOffsetMinutes=180
